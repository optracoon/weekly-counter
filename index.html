<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Weekly Counter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    input,
    button {
      font-family: inherit;
    }

    .container {
      max-width: 430px;
      margin: 0 auto;
      padding: 28px 22px 60px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .week-info {
      margin-top: 6px;
      color: #999;
      font-size: 14px;
    }

    /* =========================
       WEEK PROGRESS
    ========================= */

    .progress-wrapper {
      margin-top: 24px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      color: #aaa;
    }

    .progress-bg {
      width: 100%;
      height: 8px;
      background: #333;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #eee;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* =========================
       WEEKLY GROUPS
    ========================= */

    .weekly-section {
      margin-top: 38px;
    }

    .group {
      margin-top: 34px;
    }

    .group:first-child {
      margin-top: 0;
    }

    .group-title {
      color: #666;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .counter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
    }

    .counter-name {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.4px;
    }

    .dots {
      display: flex;
      gap: 12px;
    }

    .dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #777;
      background: transparent;
      cursor: pointer;
      transition: 0.15s;
      padding: 0;
    }

    .dot.active {
      background: #f5f5f5;
      border-color: #f5f5f5;
    }

    .dot:active {
      transform: scale(0.9);
    }

    /* =========================
       READ ONLY
    ========================= */

    .readonly-notice {
      display: none;
      margin-top: 28px;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      color: #777;
      font-size: 12px;
      text-align: center;
    }

    body.readonly .readonly-notice {
      display: block;
    }

    body.readonly .dot {
      cursor: default;
    }

    body.readonly .dot:active {
      transform: none;
    }

    /* =========================
       WEEK NAVIGATION
    ========================= */

    .week-navigation {
      display: flex;
      gap: 10px;
      margin-top: 38px;
    }

    .nav-button {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: 1px solid #444;
      color: #bbb;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-button:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .current-button {
      flex: 1.2;
    }

    /* =========================
       RESET
    ========================= */

    .reset {
      margin-top: 16px;
      width: 100%;
      padding: 11px;
      border: 1px solid #333;
      border-radius: 8px;
      background: transparent;
      color: #666;
      cursor: pointer;
      font-size: 11px;
    }

    body.readonly .reset {
      display: none;
    }

    /* =========================
       HISTORY
    ========================= */

    .history-section,
    .monthly-section,
    .data-section {
      margin-top: 46px;
      border-top: 1px solid #292929;
      padding-top: 20px;
    }

    .section-toggle {
      width: 100%;
      padding: 8px 0;
      border: none;
      background: none;
      color: #bbb;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: space-between;

      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .toggle-arrow {
      transition: transform 0.2s ease;
    }

    .toggle-arrow.open {
      transform: rotate(180deg);
    }

    .collapsible {
      display: none;
      margin-top: 18px;
    }

    .collapsible.open {
      display: block;
    }

    .history-header,
    .history-row {
      display: grid;
      grid-template-columns: 55px 1fr 1fr 1fr 1fr 1fr;
      gap: 5px;
      text-align: center;
    }

    .history-header {
      margin-bottom: 10px;
      color: #666;
      font-size: 9px;
    }

    .history-header div:first-child {
      text-align: left;
    }

    .history-row {
      align-items: center;
      min-height: 38px;
      border-bottom: 1px solid #222;
      font-size: 11px;
      cursor: pointer;
    }

    .history-week {
      text-align: left;
      color: #aaa;
      font-weight: bold;
    }

    .history-value {
      color: #aaa;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .history-pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
    }

    .history-page-button {
      border: 1px solid #333;
      background: transparent;
      color: #888;
      border-radius: 7px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .history-page-button:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .history-page-info {
      color: #666;
      font-size: 11px;
    }

    /* =========================
       MONTHLY
    ========================= */

    .month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .month-name {
      color: #aaa;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .month-nav {
      background: transparent;
      color: #777;
      border: none;
      font-size: 18px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .month-nav:disabled {
      opacity: 0.2;
    }

    .monthly-row {
      display: grid;
      grid-template-columns: 105px 1fr;
      align-items: center;
      min-height: 52px;
      border-bottom: 1px solid #222;
    }

    .monthly-label {
      color: #888;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .monthly-input-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
    }

    .monthly-input {
      width: 110px;
      background: #181818;
      border: 1px solid #333;
      border-radius: 7px;
      color: #eee;
      padding: 9px 10px;
      text-align: right;
      outline: none;
      font-size: 14px;
    }

    .monthly-input:focus {
      border-color: #666;
    }

    .monthly-input.culture {
      width: 100%;
      text-align: left;
    }

    .monthly-unit {
      color: #666;
      font-size: 12px;
      min-width: 18px;
    }

    .monthly-readonly .monthly-input {
      pointer-events: none;
      color: #999;
      background: transparent;
      border-color: transparent;
    }

    .monthly-note {
      margin-top: 14px;
      color: #555;
      font-size: 10px;
      line-height: 1.5;
    }

    /* =========================
       DATA
    ========================= */

    .data-title {
      color: #555;
      font-size: 10px;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .backup-section {
      display: flex;
      gap: 10px;
    }

    .backup-button {
      flex: 1;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: transparent;
      color: #777;
      cursor: pointer;
    }

    .backup-button:active {
      background: #1b1b1b;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- WEEK HEADER -->

  <h1 id="weekTitle">WEEK</h1>

  <div
    class="week-info"
    id="weekDates">
  </div>


  <!-- WEEK ELAPSED -->

  <div class="progress-wrapper">

    <div class="progress-label">

      <span>WEEK ELAPSED</span>

      <span id="progressPercent">
        0%
      </span>

    </div>

    <div class="progress-bg">

      <div
        class="progress-bar"
        id="progressBar">
      </div>

    </div>

  </div>


  <!-- WEEKLY -->

  <div class="weekly-section">

    <!-- BODY -->

    <div class="group">

      <div class="group-title">
        BODY
      </div>

      <div class="counter-row">

        <div class="counter-name">
          STRENGTH
        </div>

        <div
          class="dots"
          data-category="strength"
          data-count="1">
        </div>

      </div>


      <div class="counter-row">

        <div class="counter-name">
          RUNNING
        </div>

        <div
          class="dots"
          data-category="running"
          data-count="2">
        </div>

      </div>

    </div>


    <!-- GOLF -->

    <div class="group">

      <div class="group-title">
        GOLF
      </div>

      <div class="counter-row">

        <div class="counter-name">
          PRACTICE
        </div>

        <div
          class="dots"
          data-category="golf"
          data-count="2">
        </div>

      </div>


      <div class="counter-row">

        <div class="counter-name">
          COURSE
        </div>

        <div
          class="dots"
          data-category="course"
          data-count="1">
        </div>

      </div>

    </div>


    <!-- CAREER -->

    <div class="group">

      <div class="group-title">
        CAREER
      </div>

      <div class="counter-row">

        <div class="counter-name">
          TRANSITION
        </div>

        <div
          class="dots"
          data-category="career"
          data-count="1">
        </div>

      </div>

    </div>

  </div>


  <div class="readonly-notice">
    PAST WEEK · READ ONLY
  </div>


  <!-- WEEK NAVIGATION -->

  <div class="week-navigation">

    <button
      class="nav-button"
      onclick="moveWeek(-1)">
      ‹ PREV
    </button>

    <button
      class="nav-button current-button"
      id="currentWeekButton"
      onclick="goCurrentWeek()">
      CURRENT
    </button>

    <button
      class="nav-button"
      id="nextWeekButton"
      onclick="moveWeek(1)">
      NEXT ›
    </button>

  </div>


  <button
    class="reset"
    onclick="resetWeek()">
    RESET THIS WEEK
  </button>


  <!-- HISTORY -->

  <div class="history-section">

    <button
      class="section-toggle"
      onclick="toggleSection('historyContent', 'historyArrow')">

      <span>HISTORY</span>

      <span
        class="toggle-arrow"
        id="historyArrow">
        ▼
      </span>

    </button>


    <div
      class="collapsible"
      id="historyContent">

      <div class="history-header">

        <div>WEEK</div>
        <div>STR</div>
        <div>RUN</div>
        <div>PRC</div>
        <div>CRS</div>
        <div>CAR</div>

      </div>

      <div id="historyRows"></div>

      <div class="history-pagination">

        <button
          class="history-page-button"
          id="historyPrev"
          onclick="changeHistoryPage(-1)">
          ‹
        </button>

        <div
          class="history-page-info"
          id="historyPageInfo">
        </div>

        <button
          class="history-page-button"
          id="historyNext"
          onclick="changeHistoryPage(1)">
          ›
        </button>

      </div>

    </div>

  </div>


  <!-- MONTHLY -->

  <div class="monthly-section">

    <button
      class="section-toggle"
      onclick="toggleSection('monthlyContent', 'monthlyArrow')">

      <span>MONTHLY</span>

      <span
        class="toggle-arrow"
        id="monthlyArrow">
        ▼
      </span>

    </button>


    <div
      class="collapsible"
      id="monthlyContent">

      <div class="month-header">

        <button
          class="month-nav"
          onclick="moveMonth(-1)">
          ‹
        </button>

        <div
          class="month-name"
          id="monthName">
        </div>

        <button
          class="month-nav"
          id="nextMonthButton"
          onclick="moveMonth(1)">
          ›
        </button>

      </div>


      <div
        id="monthlyFields">

        <div class="monthly-row">

          <div class="monthly-label">
            WEIGHT
          </div>

          <div class="monthly-input-wrap">

            <input
              type="number"
              inputmode="decimal"
              step="0.1"
              class="monthly-input"
              id="weightInput"
              placeholder="—"
              onchange="saveMonthly()">

            <span class="monthly-unit">
              kg
            </span>

          </div>

        </div>


        <div class="monthly-row">

          <div class="monthly-label">
            LONG RUN
          </div>

          <div class="monthly-input-wrap">

            <input
              type="number"
              inputmode="decimal"
              step="0.1"
              class="monthly-input"
              id="longRunInput"
              placeholder="—"
              onchange="saveMonthly()">

            <span class="monthly-unit">
              km
            </span>

          </div>

        </div>


        <div class="monthly-row">

          <div class="monthly-label">
            CULTURE
          </div>

          <div class="monthly-input-wrap">

            <input
              type="text"
              class="monthly-input culture"
              id="cultureInput"
              placeholder="예: 김애란 2/3"
              onchange="saveMonthly()">

          </div>

        </div>

      </div>


      <div class="monthly-note">
        현재 월만 수정 가능. 과거 월은 기록 확인용.
      </div>

    </div>

  </div>


  <!-- DATA -->

  <div class="data-section">

    <div class="data-title">
      DATA
    </div>

    <div class="backup-section">

      <button
        class="backup-button"
        onclick="backupData()">
        BACKUP
      </button>

      <button
        class="backup-button"
        onclick="openRestoreFile()">
        RESTORE
      </button>

    </div>

    <input
      type="file"
      id="restoreFile"
      accept=".json,application/json"
      style="display:none"
      onchange="restoreData(event)">

  </div>

</div>


<script>

/* =========================================================
   SETTINGS
========================================================= */

const categories = {
  strength: 1,
  running: 2,
  golf: 2,
  course: 1,
  career: 1
};

const historyPerPage = 8;


/* =========================================================
   DATE
========================================================= */

function getMonday(date) {

  const d =
    new Date(date);

  const day =
    d.getDay();

  const diff =
    d.getDate()
    - day
    + (day === 0 ? -6 : 1);

  return new Date(
    d.getFullYear(),
    d.getMonth(),
    diff
  );

}


function getWeekNumber(date) {

  const d =
    new Date(
      Date.UTC(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      )
    );

  const dayNum =
    d.getUTCDay() || 7;

  d.setUTCDate(
    d.getUTCDate()
    + 4
    - dayNum
  );

  const yearStart =
    new Date(
      Date.UTC(
        d.getUTCFullYear(),
        0,
        1
      )
    );

  return Math.ceil(
    (
      (
        (d - yearStart)
        / 86400000
      )
      + 1
    )
    / 7
  );

}


function formatDate(date) {

  return (
    `${date.getMonth() + 1}.`
    +
    `${date.getDate()}`
  );

}


function getWeekKeyFromDate(date) {

  const monday =
    getMonday(date);

  return [
    monday.getFullYear(),
    monday.getMonth() + 1,
    monday.getDate()
  ].join("-");

}


function getCurrentWeekKey() {

  return getWeekKeyFromDate(
    new Date()
  );

}


function dateFromWeekKey(key) {

  const parts =
    key.split("-").map(Number);

  return new Date(
    parts[0],
    parts[1] - 1,
    parts[2]
  );

}


/* =========================================================
   WEEK VIEW
========================================================= */

let displayedMonday =
  getMonday(new Date());


function isCurrentWeek() {

  return (
    getWeekKeyFromDate(
      displayedMonday
    )
    ===
    getCurrentWeekKey()
  );

}


/* =========================================================
   WEEKLY STORAGE
========================================================= */

function getAllData() {

  try {

    return (
      JSON.parse(
        localStorage.getItem(
          "weeklyCounter"
        )
      )
      || {}
    );

  }

  catch {

    return {};

  }

}


function getWeekData(weekKey) {

  return (
    getAllData()[weekKey]
    || {}
  );

}


function saveWeekData(
  weekKey,
  data
) {

  const allData =
    getAllData();

  allData[weekKey] =
    data;

  localStorage.setItem(
    "weeklyCounter",
    JSON.stringify(allData)
  );

}


/* =========================================================
   WEEK INFO
========================================================= */

function updateWeekInfo() {

  const monday =
    new Date(
      displayedMonday
    );

  const sunday =
    new Date(monday);

  sunday.setDate(
    monday.getDate() + 6
  );


  document
    .getElementById(
      "weekTitle"
    )
    .textContent =
    `WEEK ${getWeekNumber(monday)}`;


  document
    .getElementById(
      "weekDates"
    )
    .textContent =
    `${formatDate(monday)} — ${formatDate(sunday)}`;


  const progressBar =
    document.getElementById(
      "progressBar"
    );

  const progressPercent =
    document.getElementById(
      "progressPercent"
    );


  if (isCurrentWeek()) {

    const now =
      new Date();

    const start =
      new Date(monday);

    start.setHours(
      0, 0, 0, 0
    );

    const end =
      new Date(sunday);

    end.setHours(
      23, 59, 59, 999
    );

    let percent =
      (
        (now - start)
        /
        (end - start)
      )
      * 100;

    percent =
      Math.max(
        0,
        Math.min(
          100,
          percent
        )
      );

    progressBar.style.width =
      `${percent}%`;

    progressPercent.textContent =
      `${Math.round(percent)}%`;

  }

  else {

    progressBar.style.width =
      "100%";

    progressPercent.textContent =
      "100%";

  }


  document.body.classList.toggle(
    "readonly",
    !isCurrentWeek()
  );


  document
    .getElementById(
      "nextWeekButton"
    )
    .disabled =
    isCurrentWeek();


  document
    .getElementById(
      "currentWeekButton"
    )
    .disabled =
    isCurrentWeek();

}


/* =========================================================
   COUNTERS
========================================================= */

function renderCounters() {

  const weekKey =
    getWeekKeyFromDate(
      displayedMonday
    );

  const savedData =
    getWeekData(
      weekKey
    );


  document
    .querySelectorAll(
      ".dots"
    )
    .forEach(
      container => {

        container.innerHTML =
          "";

        const category =
          container.dataset.category;

        const count =
          Number(
            container.dataset.count
          );

        const completed =
          savedData[category]
          || 0;


        for (
          let i = 0;
          i < count;
          i++
        ) {

          const dot =
            document.createElement(
              "button"
            );

          dot.className =
            "dot";


          if (i < completed) {

            dot.classList.add(
              "active"
            );

          }


          if (isCurrentWeek()) {

            dot.addEventListener(
              "click",
              () => {

                handleDotClick(
                  container,
                  dot,
                  category
                );

              }
            );

          }


          container.appendChild(
            dot
          );

        }

      }
    );

}


function handleDotClick(
  container,
  dot,
  category
) {

  const dots =
    [...container.children];

  const index =
    dots.indexOf(dot);

  const currentActive =
    dots.filter(
      d =>
        d.classList.contains(
          "active"
        )
    ).length;


  const newValue =
    index < currentActive
      ? index
      : index + 1;


  dots.forEach(
    (d, idx) => {

      d.classList.toggle(
        "active",
        idx < newValue
      );

    }
  );


  const weekKey =
    getCurrentWeekKey();

  const data =
    getWeekData(
      weekKey
    );

  data[category] =
    newValue;

  saveWeekData(
    weekKey,
    data
  );


  renderHistory();

}


/* =========================================================
   WEEK NAVIGATION
========================================================= */

function moveWeek(offset) {

  const next =
    new Date(
      displayedMonday
    );

  next.setDate(
    next.getDate()
    + offset * 7
  );


  const currentMonday =
    getMonday(
      new Date()
    );


  if (
    next > currentMonday
  ) {
    return;
  }


  displayedMonday =
    next;

  renderAll();

}


function goCurrentWeek() {

  displayedMonday =
    getMonday(
      new Date()
    );

  renderAll();

}


/* =========================================================
   RESET WEEK
========================================================= */

function resetWeek() {

  if (!isCurrentWeek()) {
    return;
  }


  if (
    !confirm(
      "이번 주 기록을 모두 초기화할까?"
    )
  ) {
    return;
  }


  const weekKey =
    getCurrentWeekKey();

  const allData =
    getAllData();

  delete allData[
    weekKey
  ];


  localStorage.setItem(
    "weeklyCounter",
    JSON.stringify(
      allData
    )
  );


  renderAll();

}


/* =========================================================
   COLLAPSIBLE
========================================================= */

function toggleSection(
  contentId,
  arrowId
) {

  const content =
    document.getElementById(
      contentId
    );

  const arrow =
    document.getElementById(
      arrowId
    );


  const open =
    content.classList.toggle(
      "open"
    );


  arrow.classList.toggle(
    "open",
    open
  );


  if (
    contentId ===
    "historyContent"
  ) {

    renderHistory();

  }


  if (
    contentId ===
    "monthlyContent"
  ) {

    renderMonthly();

  }

}


/* =========================================================
   HISTORY
========================================================= */

let historyPage = 0;


function createDotsText(
  value,
  max
) {

  let output =
    "";

  for (
    let i = 0;
    i < max;
    i++
  ) {

    output +=
      i < value
        ? "●"
        : "○";

  }

  return output;

}


function generateHistoryWeeks() {

  const weeks =
    [];

  const currentMonday =
    getMonday(
      new Date()
    );

  const allData =
    getAllData();

  const savedKeys =
    Object.keys(
      allData
    );


  let earliestDate =
    new Date(
      currentMonday
    );

  earliestDate.setDate(
    earliestDate.getDate()
    - 11 * 7
  );


  savedKeys.forEach(
    key => {

      const date =
        dateFromWeekKey(
          key
        );

      if (
        date < earliestDate
      ) {

        earliestDate =
          date;

      }

    }
  );


  let cursor =
    new Date(
      currentMonday
    );


  while (
    cursor >= earliestDate
  ) {

    weeks.push(
      new Date(cursor)
    );

    cursor.setDate(
      cursor.getDate() - 7
    );

  }


  return weeks;

}


function renderHistory() {

  const container =
    document.getElementById(
      "historyRows"
    );


  const weeks =
    generateHistoryWeeks();


  const totalPages =
    Math.max(
      1,
      Math.ceil(
        weeks.length
        /
        historyPerPage
      )
    );


  historyPage =
    Math.max(
      0,
      Math.min(
        historyPage,
        totalPages - 1
      )
    );


  const start =
    historyPage
    * historyPerPage;


  const pageWeeks =
    weeks.slice(
      start,
      start
      + historyPerPage
    );


  container.innerHTML =
    "";


  pageWeeks.forEach(
    monday => {

      const key =
        getWeekKeyFromDate(
          monday
        );

      const data =
        getWeekData(
          key
        );


      const row =
        document.createElement(
          "div"
        );

      row.className =
        "history-row";


      const values = [

        `W${getWeekNumber(monday)}`,

        createDotsText(
          data.strength || 0,
          1
        ),

        createDotsText(
          data.running || 0,
          2
        ),

        createDotsText(
          data.golf || 0,
          2
        ),

        createDotsText(
          data.course || 0,
          1
        ),

        createDotsText(
          data.career || 0,
          1
        )

      ];


      values.forEach(
        (value, index) => {

          const cell =
            document.createElement(
              "div"
            );

          cell.className =
            index === 0
              ? "history-week"
              : "history-value";

          cell.textContent =
            value;

          row.appendChild(
            cell
          );

        }
      );


      row.addEventListener(
        "click",
        () => {

          displayedMonday =
            new Date(monday);

          renderAll();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );


      container.appendChild(
        row
      );

    }
  );


  document
    .getElementById(
      "historyPageInfo"
    )
    .textContent =
    `${historyPage + 1} / ${totalPages}`;


  document
    .getElementById(
      "historyPrev"
    )
    .disabled =
    historyPage === 0;


  document
    .getElementById(
      "historyNext"
    )
    .disabled =
    historyPage
    >= totalPages - 1;

}


function changeHistoryPage(
  direction
) {

  historyPage +=
    direction;

  renderHistory();

}


/* =========================================================
   MONTHLY STORAGE
========================================================= */

function getAllMonthlyData() {

  try {

    return (
      JSON.parse(
        localStorage.getItem(
          "monthlyCounter"
        )
      )
      || {}
    );

  }

  catch {

    return {};

  }

}


function getMonthKey(date) {

  return (
    date.getFullYear()
    +
    "-"
    +
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    )
  );

}


let displayedMonth =
  new Date(
    new Date().getFullYear(),
    new Date().getMonth(),
    1
  );


function isCurrentMonth() {

  return (
    getMonthKey(
      displayedMonth
    )
    ===
    getMonthKey(
      new Date()
    )
  );

}


function renderMonthly() {

  const key =
    getMonthKey(
      displayedMonth
    );

  const allData =
    getAllMonthlyData();

  const data =
    allData[key]
    || {};


  document
    .getElementById(
      "monthName"
    )
    .textContent =
    `${displayedMonth.getFullYear()} · ${String(
      displayedMonth.getMonth() + 1
    ).padStart(2, "0")}`;


  document
    .getElementById(
      "weightInput"
    )
    .value =
    data.weight ?? "";


  document
    .getElementById(
      "longRunInput"
    )
    .value =
    data.longRun ?? "";


  document
    .getElementById(
      "cultureInput"
    )
    .value =
    data.culture ?? "";


  document
    .getElementById(
      "monthlyFields"
    )
    .classList.toggle(
      "monthly-readonly",
      !isCurrentMonth()
    );


  document
    .getElementById(
      "nextMonthButton"
    )
    .disabled =
    isCurrentMonth();

}


function saveMonthly() {

  if (
    !isCurrentMonth()
  ) {
    return;
  }


  const key =
    getMonthKey(
      displayedMonth
    );

  const allData =
    getAllMonthlyData();


  allData[key] = {

    weight:
      document
        .getElementById(
          "weightInput"
        )
        .value,

    longRun:
      document
        .getElementById(
          "longRunInput"
        )
        .value,

    culture:
      document
        .getElementById(
          "cultureInput"
        )
        .value.trim()

  };


  localStorage.setItem(
    "monthlyCounter",
    JSON.stringify(
      allData
    )
  );

}


function moveMonth(offset) {

  const next =
    new Date(
      displayedMonth
    );

  next.setMonth(
    next.getMonth()
    + offset
  );


  const current =
    new Date(
      new Date().getFullYear(),
      new Date().getMonth(),
      1
    );


  if (
    next > current
  ) {
    return;
  }


  displayedMonth =
    next;

  renderMonthly();

}


/* =========================================================
   BACKUP
========================================================= */

function backupData() {

  const backup = {

    app:
      "weekly-counter",

    version:
      2,

    createdAt:
      new Date()
        .toISOString(),

    weekly:
      getAllData(),

    monthly:
      getAllMonthlyData()

  };


  const json =
    JSON.stringify(
      backup,
      null,
      2
    );


  const blob =
    new Blob(
      [json],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  const today =
    new Date()
      .toISOString()
      .slice(
        0,
        10
      );


  link.href =
    url;


  link.download =
    `weekly-counter-backup-${today}.json`;


  document.body.appendChild(
    link
  );


  link.click();


  document.body.removeChild(
    link
  );


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}


/* =========================================================
   RESTORE
========================================================= */

function openRestoreFile() {

  document
    .getElementById(
      "restoreFile"
    )
    .click();

}


function restoreData(event) {

  const file =
    event.target.files[0];


  if (!file) {
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      try {

        const backup =
          JSON.parse(
            e.target.result
          );


        if (
          backup.app
          !==
          "weekly-counter"
        ) {

          alert(
            "Weekly Counter 백업 파일이 아니야."
          );

          event.target.value =
            "";

          return;

        }


        if (
          !confirm(
            "현재 기록을 백업 파일의 기록으로 교체할까?"
          )
        ) {

          event.target.value =
            "";

          return;

        }


        /*
          VERSION 1 백업 호환
        */

        if (
          backup.version === 1
          &&
          backup.data
        ) {

          localStorage.setItem(
            "weeklyCounter",
            JSON.stringify(
              backup.data
            )
          );

        }

        else {

          localStorage.setItem(
            "weeklyCounter",
            JSON.stringify(
              backup.weekly
              || {}
            )
          );


          localStorage.setItem(
            "monthlyCounter",
            JSON.stringify(
              backup.monthly
              || {}
            )
          );

        }


        historyPage =
          0;


        displayedMonday =
          getMonday(
            new Date()
          );


        displayedMonth =
          new Date(
            new Date().getFullYear(),
            new Date().getMonth(),
            1
          );


        renderAll();


        alert(
          "RESTORE 완료."
        );

      }

      catch {

        alert(
          "백업 파일을 읽을 수 없어."
        );

      }


      event.target.value =
        "";

    };


  reader.readAsText(
    file
  );

}


/* =========================================================
   RENDER
========================================================= */

function renderAll() {

  updateWeekInfo();

  renderCounters();

  renderHistory();

  renderMonthly();

}


/* =========================================================
   START
========================================================= */

renderAll();

</script>
