<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Weekly Counter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 430px;
      margin: 0 auto;
      padding: 28px 22px 60px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .week-info {
      margin-top: 6px;
      color: #999;
      font-size: 14px;
    }


    /* =========================
       WEEK PROGRESS
    ========================= */

    .progress-wrapper {
      margin-top: 24px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      color: #aaa;
    }

    .progress-bg {
      width: 100%;
      height: 8px;
      background: #333;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #eee;
      width: 0%;
      transition: width 0.3s ease;
    }


    /* =========================
       WEEKLY GROUPS
    ========================= */

    .weekly-section {
      margin-top: 38px;
    }

    .group {
      margin-top: 34px;
    }

    .group:first-child {
      margin-top: 0;
    }

    .group-title {
      color: #666;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .counter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
    }

    .counter-name {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.4px;
    }

    .counter-name.workout-link {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .workout-arrow {
      color: #555;
      font-size: 16px;
      font-weight: normal;
    }

    .dots {
      display: flex;
      gap: 12px;
    }

    .dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #777;
      background: transparent;
      cursor: pointer;
      transition: 0.15s;
      padding: 0;
    }

    .dot.active {
      background: #f5f5f5;
      border-color: #f5f5f5;
    }

    .dot:active {
      transform: scale(0.9);
    }


    /* =========================
       READ ONLY
    ========================= */

    .readonly-notice {
      display: none;
      margin-top: 28px;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      color: #777;
      font-size: 12px;
      text-align: center;
    }

    body.readonly .readonly-notice {
      display: block;
    }

    body.readonly .dot {
      cursor: default;
    }

    body.readonly .dot:active {
      transform: none;
    }


    /* =========================
       WEEK NAVIGATION
    ========================= */

    .week-navigation {
      display: flex;
      gap: 10px;
      margin-top: 38px;
    }

    .nav-button {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: 1px solid #444;
      color: #bbb;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-button:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .current-button {
      flex: 1.2;
    }


    /* =========================
       RESET
    ========================= */

    .reset {
      margin-top: 16px;
      width: 100%;
      padding: 11px;
      border: 1px solid #333;
      border-radius: 8px;
      background: transparent;
      color: #666;
      cursor: pointer;
      font-size: 11px;
    }

    body.readonly .reset {
      display: none;
    }


    /* =========================
       HISTORY / MONTHLY
    ========================= */

    .history-section,
    .monthly-section,
    .data-section {
      margin-top: 46px;
      border-top: 1px solid #292929;
      padding-top: 20px;
    }

    .section-toggle {
      width: 100%;
      padding: 8px 0;
      border: none;
      background: none;
      color: #bbb;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .toggle-arrow {
      transition: transform 0.2s ease;
    }

    .toggle-arrow.open {
      transform: rotate(180deg);
    }

    .collapsible {
      display: none;
      margin-top: 18px;
    }

    .collapsible.open {
      display: block;
    }


    /* =========================
       HISTORY
    ========================= */

    .history-header,
    .history-row {
      display: grid;
      grid-template-columns: 55px 1fr 1fr 1fr 1fr 1fr;
      gap: 5px;
      text-align: center;
    }

    .history-header {
      margin-bottom: 10px;
      color: #666;
      font-size: 9px;
    }

    .history-header div:first-child {
      text-align: left;
    }

    .history-row {
      align-items: center;
      min-height: 38px;
      border-bottom: 1px solid #222;
      font-size: 11px;
      cursor: pointer;
    }

    .history-week {
      text-align: left;
      color: #aaa;
      font-weight: bold;
    }

    .history-value {
      color: #aaa;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .history-pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
    }

    .history-page-button {
      border: 1px solid #333;
      background: transparent;
      color: #888;
      border-radius: 7px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .history-page-button:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .history-page-info {
      color: #666;
      font-size: 11px;
    }


    /* =========================
       MONTHLY
    ========================= */

    .month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .month-name {
      color: #aaa;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .month-nav {
      background: transparent;
      color: #777;
      border: none;
      font-size: 18px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .month-nav:disabled {
      opacity: 0.2;
    }

    .monthly-row {
      display: grid;
      grid-template-columns: 105px 1fr;
      align-items: center;
      min-height: 52px;
      border-bottom: 1px solid #222;
    }

    .monthly-label {
      color: #888;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .monthly-input-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
    }

    .monthly-input {
      width: 110px;
      background: #181818;
      border: 1px solid #333;
      border-radius: 7px;
      color: #eee;
      padding: 9px 10px;
      text-align: right;
      outline: none;
      font-size: 14px;
    }

    .monthly-input:focus {
      border-color: #666;
    }

    .monthly-input.culture {
      width: 100%;
      text-align: left;
    }

    .monthly-unit {
      color: #666;
      font-size: 12px;
      min-width: 18px;
    }

    .monthly-readonly .monthly-input {
      pointer-events: none;
      color: #999;
      background: transparent;
      border-color: transparent;
    }

    .monthly-note {
      margin-top: 14px;
      color: #555;
      font-size: 10px;
      line-height: 1.5;
    }


    /* =========================
       BACKUP
    ========================= */

    .data-title {
      color: #555;
      font-size: 10px;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .backup-section {
      display: flex;
      gap: 10px;
    }

    .backup-button {
      flex: 1;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: transparent;
      color: #777;
      cursor: pointer;
    }


    /* =========================================================
       WORKOUT SCREEN
    ========================================================= */

    #workoutScreen {
      display: none;
    }

    #workoutScreen.open {
      display: block;
    }

    #mainScreen.hidden {
      display: none;
    }

    .workout-header {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .back-button {
      background: none;
      border: none;
      color: #999;
      font-size: 28px;
      padding: 0 14px 0 0;
      cursor: pointer;
    }

    .workout-title {
      font-size: 24px;
      font-weight: bold;
    }

    .workout-subtitle {
      margin-top: 7px;
      color: #666;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .workout-progress {
      margin-top: 28px;
    }

    .workout-progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      color: #999;
      font-size: 12px;
    }

    .exercise-list {
      margin-top: 38px;
    }

    .exercise {
      border-bottom: 1px solid #222;
      padding: 20px 0 22px;
    }

    .exercise:first-child {
      padding-top: 0;
    }

    .exercise-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .exercise-info {
      min-width: 0;
      flex: 1;
    }

    .exercise-name {
      font-size: 16px;
      font-weight: bold;
    }

    .exercise-reps {
      margin-top: 6px;
      color: #666;
      font-size: 12px;
    }

    .previous-weight {
      margin-top: 6px;
      color: #555;
      font-size: 10px;
      letter-spacing: 0.4px;
    }

    .weight-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 14px;
    }

    .weight-input {
      width: 74px;
      background: #181818;
      color: #eee;
      border: 1px solid #333;
      border-radius: 7px;
      padding: 8px 8px;
      font-size: 15px;
      text-align: right;
      outline: none;
    }

    .weight-input:focus {
      border-color: #666;
    }

    .weight-unit {
      color: #666;
      font-size: 11px;
    }

    .exercise-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .set-dots {
      display: flex;
      gap: 10px;
    }

    .set-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #666;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transition: 0.15s;
    }

    .set-dot.active {
      background: #f5f5f5;
      border-color: #f5f5f5;
    }

    .set-dot:active {
      transform: scale(0.9);
    }

    .finish-button {
      margin-top: 36px;
      width: 100%;
      padding: 16px;
      border-radius: 9px;
      border: none;
      background: #eee;
      color: #111;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .finish-button:disabled {
      background: #292929;
      color: #666;
      cursor: default;
    }

    .workout-reset {
      width: 100%;
      margin-top: 13px;
      padding: 12px;
      background: transparent;
      color: #555;
      border: 1px solid #292929;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
    }

    .workout-finished {
      margin-top: 22px;
      padding: 13px;
      border: 1px solid #333;
      border-radius: 8px;
      color: #aaa;
      text-align: center;
      font-size: 12px;
      display: none;
    }

    .workout-finished.show {
      display: block;
    }

  </style>
</head>


<body>

<!-- =========================================================
     MAIN SCREEN
========================================================= -->

<div class="container" id="mainScreen">

  <h1 id="weekTitle">
    WEEK
  </h1>

  <div class="week-info" id="weekDates"></div>


  <!-- WEEK ELAPSED -->

  <div class="progress-wrapper">

    <div class="progress-label">
      <span>WEEK ELAPSED</span>
      <span id="progressPercent">0%</span>
    </div>

    <div class="progress-bg">
      <div class="progress-bar" id="progressBar"></div>
    </div>

  </div>


  <!-- WEEKLY -->

  <div class="weekly-section">

    <!-- BODY -->

    <div class="group">

      <div class="group-title">
        BODY
      </div>

      <div class="counter-row">

        <div
          class="counter-name workout-link"
          onclick="openWorkout()">

          <span>STRENGTH</span>
          <span class="workout-arrow">›</span>

        </div>

        <div
          class="dots"
          data-category="strength"
          data-count="1">
        </div>

      </div>


      <div class="counter-row">

        <div class="counter-name">
          RUNNING
        </div>

        <div
          class="dots"
          data-category="running"
          data-count="2">
        </div>

      </div>

    </div>


    <!-- GOLF -->

    <div class="group">

      <div class="group-title">
        GOLF
      </div>

      <div class="counter-row">

        <div class="counter-name">
          PRACTICE
        </div>

        <div
          class="dots"
          data-category="golf"
          data-count="2">
        </div>

      </div>


      <div class="counter-row">

        <div class="counter-name">
          COURSE
        </div>

        <div
          class="dots"
          data-category="course"
          data-count="1">
        </div>

      </div>

    </div>


    <!-- CAREER -->

    <div class="group">

      <div class="group-title">
        CAREER
      </div>

      <div class="counter-row">

        <div class="counter-name">
          TRANSITION
        </div>

        <div
          class="dots"
          data-category="career"
          data-count="1">
        </div>

      </div>

    </div>

  </div>


  <div class="readonly-notice">
    PAST WEEK · READ ONLY
  </div>


  <!-- WEEK NAVIGATION -->

  <div class="week-navigation">

    <button
      class="nav-button"
      onclick="moveWeek(-1)">
      ‹ PREV
    </button>

    <button
      class="nav-button current-button"
      id="currentWeekButton"
      onclick="goCurrentWeek()">
      CURRENT
    </button>

    <button
      class="nav-button"
      id="nextWeekButton"
      onclick="moveWeek(1)">
      NEXT ›
    </button>

  </div>


  <button
    class="reset"
    onclick="resetWeek()">
    RESET THIS WEEK
  </button>


  <!-- HISTORY -->

  <div class="history-section">

    <button
      class="section-toggle"
      onclick="toggleSection('historyContent', 'historyArrow')">

      <span>HISTORY</span>
      <span class="toggle-arrow" id="historyArrow">▼</span>

    </button>


    <div class="collapsible" id="historyContent">

      <div class="history-header">
        <div>WEEK</div>
        <div>STR</div>
        <div>RUN</div>
        <div>PRC</div>
        <div>CRS</div>
        <div>CAR</div>
      </div>

      <div id="historyRows"></div>

      <div class="history-pagination">

        <button
          class="history-page-button"
          id="historyPrev"
          onclick="changeHistoryPage(-1)">
          ‹
        </button>

        <div
          class="history-page-info"
          id="historyPageInfo">
        </div>

        <button
          class="history-page-button"
          id="historyNext"
          onclick="changeHistoryPage(1)">
          ›
        </button>

      </div>

    </div>

  </div>


  <!-- MONTHLY -->

  <div class="monthly-section">

    <button
      class="section-toggle"
      onclick="toggleSection('monthlyContent', 'monthlyArrow')">

      <span>MONTHLY</span>
      <span class="toggle-arrow" id="monthlyArrow">▼</span>

    </button>


    <div class="collapsible" id="monthlyContent">

      <div class="month-header">

        <button
          class="month-nav"
          onclick="moveMonth(-1)">
          ‹
        </button>

        <div class="month-name" id="monthName"></div>

        <button
          class="month-nav"
          id="nextMonthButton"
          onclick="moveMonth(1)">
          ›
        </button>

      </div>


      <div id="monthlyFields">

        <div class="monthly-row">

          <div class="monthly-label">
            WEIGHT
          </div>

          <div class="monthly-input-wrap">

            <input
              type="number"
              inputmode="decimal"
              step="0.1"
              class="monthly-input"
              id="weightInput"
              placeholder="—"
              onchange="saveMonthly()">

            <span class="monthly-unit">
              kg
            </span>

          </div>

        </div>


        <div class="monthly-row">

          <div class="monthly-label">
            LONG RUN
          </div>

          <div class="monthly-input-wrap">

            <input
              type="number"
              inputmode="decimal"
              step="0.1"
              class="monthly-input"
              id="longRunInput"
              placeholder="—"
              onchange="saveMonthly()">

            <span class="monthly-unit">
              km
            </span>

          </div>

        </div>


        <div class="monthly-row">

          <div class="monthly-label">
            CULTURE
          </div>

          <div class="monthly-input-wrap">

            <input
              type="text"
              class="monthly-input culture"
              id="cultureInput"
              placeholder="예: 김애란 2/3"
              onchange="saveMonthly()">

          </div>

        </div>

      </div>


      <div class="monthly-note">
        현재 월만 수정 가능. 과거 월은 기록 확인용.
      </div>

    </div>

  </div>


  <!-- DATA -->

  <div class="data-section">

    <div class="data-title">
      DATA
    </div>

    <div class="backup-section">

      <button
        class="backup-button"
        onclick="backupData()">
        BACKUP
      </button>

      <button
        class="backup-button"
        onclick="openRestoreFile()">
        RESTORE
      </button>

    </div>


    <input
      type="file"
      id="restoreFile"
      accept=".json,application/json"
      style="display:none"
      onchange="restoreData(event)">

  </div>

</div>



<!-- =========================================================
     WORKOUT SCREEN
========================================================= -->

<div class="container" id="workoutScreen">


  <div class="workout-header">

    <button
      class="back-button"
      onclick="closeWorkout()">
      ‹
    </button>

    <div class="workout-title">
      STRENGTH
    </div>

  </div>


  <div class="workout-subtitle">
    ROUTINE B · FULL BODY
  </div>


  <!-- WORKOUT PROGRESS -->

  <div class="workout-progress">

    <div class="workout-progress-info">

      <span id="workoutSetText">
        0 / 15 SETS
      </span>

      <span id="workoutPercent">
        0%
      </span>

    </div>

    <div class="progress-bg">

      <div
        class="progress-bar"
        id="workoutProgressBar">
      </div>

    </div>

  </div>


  <!-- EXERCISES -->

  <div
    class="exercise-list"
    id="exerciseList">
  </div>


  <div
    class="workout-finished"
    id="workoutFinished">
    WORKOUT COMPLETE
  </div>


  <button
    class="finish-button"
    id="finishWorkoutButton"
    onclick="finishWorkout()">
    FINISH WORKOUT
  </button>


  <button
    class="workout-reset"
    onclick="resetWorkout()">
    RESET WORKOUT
  </button>

</div>



<script>

/* =========================================================
   SETTINGS
========================================================= */

const categories = {
  strength: 1,
  running: 2,
  golf: 2,
  course: 1,
  career: 1
};

const historyPerPage = 8;


/* =========================================================
   ROUTINE B
========================================================= */

const workoutExercises = [

  {
    id: "squat",
    name: "SQUAT",
    reps: 8,
    sets: 3
  },

  {
    id: "legcurl",
    name: "LEG CURL",
    reps: 12,
    sets: 3
  },

  {
    id: "seatedrow",
    name: "SEATED ROW",
    reps: 12,
    sets: 3
  },

  {
    id: "inclinepress",
    name: "INCLINE PRESS",
    reps: 10,
    sets: 3
  },

  {
    id: "reardelt",
    name: "REAR DELT FLY",
    reps: 20,
    sets: 3
  }

];


const totalWorkoutSets =
  workoutExercises.reduce(
    (sum, exercise) =>
      sum + exercise.sets,
    0
  );


/* =========================================================
   DATE
========================================================= */

function getMonday(date) {

  const d =
    new Date(date);

  const day =
    d.getDay();

  const diff =
    d.getDate()
    - day
    + (day === 0 ? -6 : 1);

  return new Date(
    d.getFullYear(),
    d.getMonth(),
    diff
  );

}


function getWeekNumber(date) {

  const d =
    new Date(
      Date.UTC(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      )
    );

  const dayNum =
    d.getUTCDay() || 7;

  d.setUTCDate(
    d.getUTCDate()
    + 4
    - dayNum
  );

  const yearStart =
    new Date(
      Date.UTC(
        d.getUTCFullYear(),
        0,
        1
      )
    );

  return Math.ceil(
    (
      (
        (d - yearStart)
        / 86400000
      )
      + 1
    )
    / 7
  );

}


function formatDate(date) {

  return (
    `${date.getMonth() + 1}.`
    +
    `${date.getDate()}`
  );

}


function getWeekKeyFromDate(date) {

  const monday =
    getMonday(date);

  return [
    monday.getFullYear(),
    monday.getMonth() + 1,
    monday.getDate()
  ].join("-");

}


function getCurrentWeekKey() {

  return getWeekKeyFromDate(
    new Date()
  );

}


function dateFromWeekKey(key) {

  const parts =
    key.split("-").map(Number);

  return new Date(
    parts[0],
    parts[1] - 1,
    parts[2]
  );

}


/* =========================================================
   WEEK VIEW
========================================================= */

let displayedMonday =
  getMonday(new Date());


function isCurrentWeek() {

  return (
    getWeekKeyFromDate(
      displayedMonday
    )
    ===
    getCurrentWeekKey()
  );

}


/* =========================================================
   WEEK STORAGE
========================================================= */

function getAllData() {

  try {

    return (
      JSON.parse(
        localStorage.getItem(
          "weeklyCounter"
        )
      )
      || {}
    );

  }

  catch {

    return {};

  }

}


function getWeekData(weekKey) {

  return (
    getAllData()[weekKey]
    || {}
  );

}


function saveWeekData(
  weekKey,
  data
) {

  const allData =
    getAllData();

  allData[weekKey] =
    data;


  localStorage.setItem(
    "weeklyCounter",
    JSON.stringify(allData)
  );

}


/* =========================================================
   WEEK DISPLAY
========================================================= */

function updateWeekInfo() {

  const monday =
    new Date(
      displayedMonday
    );

  const sunday =
    new Date(monday);

  sunday.setDate(
    monday.getDate() + 6
  );


  document
    .getElementById(
      "weekTitle"
    )
    .textContent =
    `WEEK ${getWeekNumber(monday)}`;


  document
    .getElementById(
      "weekDates"
    )
    .textContent =
    `${formatDate(monday)} — ${formatDate(sunday)}`;


  const progressBar =
    document.getElementById(
      "progressBar"
    );

  const progressPercent =
    document.getElementById(
      "progressPercent"
    );


  if (isCurrentWeek()) {

    const now =
      new Date();

    const start =
      new Date(monday);

    start.setHours(
      0, 0, 0, 0
    );

    const end =
      new Date(sunday);

    end.setHours(
      23, 59, 59, 999
    );


    let percent =
      (
        (now - start)
        /
        (end - start)
      )
      * 100;


    percent =
      Math.max(
        0,
        Math.min(
          100,
          percent
        )
      );


    progressBar.style.width =
      `${percent}%`;


    progressPercent.textContent =
      `${Math.round(percent)}%`;

  }

  else {

    progressBar.style.width =
      "100%";

    progressPercent.textContent =
      "100%";

  }


  document.body.classList.toggle(
    "readonly",
    !isCurrentWeek()
  );


  document
    .getElementById(
      "nextWeekButton"
    )
    .disabled =
    isCurrentWeek();


  document
    .getElementById(
      "currentWeekButton"
    )
    .disabled =
    isCurrentWeek();

}


/* =========================================================
   WEEK COUNTERS
========================================================= */

function renderCounters() {

  const weekKey =
    getWeekKeyFromDate(
      displayedMonday
    );

  const savedData =
    getWeekData(
      weekKey
    );


  document
    .querySelectorAll(
      ".dots"
    )
    .forEach(
      container => {

        container.innerHTML =
          "";


        const category =
          container.dataset.category;


        const count =
          Number(
            container.dataset.count
          );


        const completed =
          savedData[category]
          || 0;


        for (
          let i = 0;
          i < count;
          i++
        ) {

          const dot =
            document.createElement(
              "button"
            );


          dot.className =
            "dot";


          if (
            i < completed
          ) {

            dot.classList.add(
              "active"
            );

          }


          if (
            isCurrentWeek()
          ) {

            dot.addEventListener(
              "click",
              () => {

                handleDotClick(
                  container,
                  dot,
                  category
                );

              }
            );

          }


          container.appendChild(
            dot
          );

        }

      }
    );

}


function handleDotClick(
  container,
  dot,
  category
) {

  const dots =
    [...container.children];


  const index =
    dots.indexOf(dot);


  const currentActive =
    dots.filter(
      d =>
        d.classList.contains(
          "active"
        )
    ).length;


  const newValue =
    index < currentActive
      ? index
      : index + 1;


  dots.forEach(
    (d, idx) => {

      d.classList.toggle(
        "active",
        idx < newValue
      );

    }
  );


  const weekKey =
    getCurrentWeekKey();


  const data =
    getWeekData(
      weekKey
    );


  data[category] =
    newValue;


  saveWeekData(
    weekKey,
    data
  );


  renderHistory();

}


/* =========================================================
   WEEK NAVIGATION
========================================================= */

function moveWeek(offset) {

  const next =
    new Date(
      displayedMonday
    );


  next.setDate(
    next.getDate()
    + offset * 7
  );


  const currentMonday =
    getMonday(
      new Date()
    );


  if (
    next > currentMonday
  ) {
    return;
  }


  displayedMonday =
    next;


  renderAll();

}


function goCurrentWeek() {

  displayedMonday =
    getMonday(
      new Date()
    );


  renderAll();

}


/* =========================================================
   RESET WEEK
========================================================= */

function resetWeek() {

  if (
    !isCurrentWeek()
  ) {
    return;
  }


  if (
    !confirm(
      "이번 주 기록을 모두 초기화할까?"
    )
  ) {
    return;
  }


  const weekKey =
    getCurrentWeekKey();


  const allData =
    getAllData();


  delete allData[
    weekKey
  ];


  localStorage.setItem(
    "weeklyCounter",
    JSON.stringify(
      allData
    )
  );


  renderAll();

}


/* =========================================================
   COLLAPSIBLE
========================================================= */

function toggleSection(
  contentId,
  arrowId
) {

  const content =
    document.getElementById(
      contentId
    );


  const arrow =
    document.getElementById(
      arrowId
    );


  const open =
    content.classList.toggle(
      "open"
    );


  arrow.classList.toggle(
    "open",
    open
  );


  if (
    contentId ===
    "historyContent"
  ) {

    renderHistory();

  }


  if (
    contentId ===
    "monthlyContent"
  ) {

    renderMonthly();

  }

}


/* =========================================================
   HISTORY
========================================================= */

let historyPage = 0;


function createDotsText(
  value,
  max
) {

  let output =
    "";


  for (
    let i = 0;
    i < max;
    i++
  ) {

    output +=
      i < value
        ? "●"
        : "○";

  }


  return output;

}


function generateHistoryWeeks() {

  const weeks =
    [];


  const currentMonday =
    getMonday(
      new Date()
    );


  const allData =
    getAllData();


  const savedKeys =
    Object.keys(
      allData
    );


  let earliestDate =
    new Date(
      currentMonday
    );


  earliestDate.setDate(
    earliestDate.getDate()
    - 11 * 7
  );


  savedKeys.forEach(
    key => {

      const date =
        dateFromWeekKey(
          key
        );


      if (
        date < earliestDate
      ) {

        earliestDate =
          date;

      }

    }
  );


  let cursor =
    new Date(
      currentMonday
    );


  while (
    cursor >= earliestDate
  ) {

    weeks.push(
      new Date(cursor)
    );


    cursor.setDate(
      cursor.getDate()
      - 7
    );

  }


  return weeks;

}


function renderHistory() {

  const container =
    document.getElementById(
      "historyRows"
    );


  const weeks =
    generateHistoryWeeks();


  const totalPages =
    Math.max(
      1,
      Math.ceil(
        weeks.length
        /
        historyPerPage
      )
    );


  historyPage =
    Math.max(
      0,
      Math.min(
        historyPage,
        totalPages - 1
      )
    );


  const start =
    historyPage
    * historyPerPage;


  const pageWeeks =
    weeks.slice(
      start,
      start
      + historyPerPage
    );


  container.innerHTML =
    "";


  pageWeeks.forEach(
    monday => {

      const key =
        getWeekKeyFromDate(
          monday
        );


      const data =
        getWeekData(
          key
        );


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "history-row";


      const values = [

        `W${getWeekNumber(monday)}`,

        createDotsText(
          data.strength || 0,
          1
        ),

        createDotsText(
          data.running || 0,
          2
        ),

        createDotsText(
          data.golf || 0,
          2
        ),

        createDotsText(
          data.course || 0,
          1
        ),

        createDotsText(
          data.career || 0,
          1
        )

      ];


      values.forEach(
        (value, index) => {

          const cell =
            document.createElement(
              "div"
            );


          cell.className =
            index === 0
              ? "history-week"
              : "history-value";


          cell.textContent =
            value;


          row.appendChild(
            cell
          );

        }
      );


      row.addEventListener(
        "click",
        () => {

          displayedMonday =
            new Date(monday);


          renderAll();


          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );


      container.appendChild(
        row
      );

    }
  );


  document
    .getElementById(
      "historyPageInfo"
    )
    .textContent =
    `${historyPage + 1} / ${totalPages}`;


  document
    .getElementById(
      "historyPrev"
    )
    .disabled =
    historyPage === 0;


  document
    .getElementById(
      "historyNext"
    )
    .disabled =
    historyPage
    >= totalPages - 1;

}


function changeHistoryPage(
  direction
) {

  historyPage +=
    direction;


  renderHistory();

}


/* =========================================================
   MONTHLY
========================================================= */

function getAllMonthlyData() {

  try {

    return (
      JSON.parse(
        localStorage.getItem(
          "monthlyCounter"
        )
      )
      || {}
    );

  }

  catch {

    return {};

  }

}


function getMonthKey(date) {

  return (
    date.getFullYear()
    +
    "-"
    +
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    )
  );

}


let displayedMonth =
  new Date(
    new Date().getFullYear(),
    new Date().getMonth(),
    1
  );


function isCurrentMonth() {

  return (
    getMonthKey(
      displayedMonth
    )
    ===
    getMonthKey(
      new Date()
    )
  );

}


function renderMonthly() {

  const key =
    getMonthKey(
      displayedMonth
    );


  const allData =
    getAllMonthlyData();


  const data =
    allData[key]
    || {};


  document
    .getElementById(
      "monthName"
    )
    .textContent =
    `${displayedMonth.getFullYear()} · ${String(
      displayedMonth.getMonth() + 1
    ).padStart(2, "0")}`;


  document
    .getElementById(
      "weightInput"
    )
    .value =
    data.weight ?? "";


  document
    .getElementById(
      "longRunInput"
    )
    .value =
    data.longRun ?? "";


  document
    .getElementById(
      "cultureInput"
    )
    .value =
    data.culture ?? "";


  document
    .getElementById(
      "monthlyFields"
    )
    .classList.toggle(
      "monthly-readonly",
      !isCurrentMonth()
    );


  document
    .getElementById(
      "nextMonthButton"
    )
    .disabled =
    isCurrentMonth();

}


function saveMonthly() {

  if (
    !isCurrentMonth()
  ) {
    return;
  }


  const key =
    getMonthKey(
      displayedMonth
    );


  const allData =
    getAllMonthlyData();


  allData[key] = {

    weight:
      document
        .getElementById(
          "weightInput"
        )
        .value,

    longRun:
      document
        .getElementById(
          "longRunInput"
        )
        .value,

    culture:
      document
        .getElementById(
          "cultureInput"
        )
        .value.trim()

  };


  localStorage.setItem(
    "monthlyCounter",
    JSON.stringify(
      allData
    )
  );

}


function moveMonth(offset) {

  const next =
    new Date(
      displayedMonth
    );


  next.setMonth(
    next.getMonth()
    + offset
  );


  const current =
    new Date(
      new Date().getFullYear(),
      new Date().getMonth(),
      1
    );


  if (
    next > current
  ) {
    return;
  }


  displayedMonth =
    next;


  renderMonthly();

}


/* =========================================================
   WORKOUT STORAGE
========================================================= */

function getAllWorkoutData() {

  try {

    return (
      JSON.parse(
        localStorage.getItem(
          "workoutCounter"
        )
      )
      || {}
    );

  }

  catch {

    return {};

  }

}


function createDefaultWorkoutData() {

  const exercises = {};


  workoutExercises.forEach(
    exercise => {

      exercises[
        exercise.id
      ] = {
        sets: 0,
        weight: ""
      };

    }
  );


  return {
    completed: false,
    exercises: exercises
  };

}


function normalizeWorkoutData(data) {

  if (
    !data
    ||
    typeof data !== "object"
  ) {

    data =
      createDefaultWorkoutData();

  }


  if (
    !data.exercises
  ) {

    data.exercises =
      {};

  }


  workoutExercises.forEach(
    exercise => {

      const current =
        data.exercises[
          exercise.id
        ];


      /*
        이전 버전:
        exercise 값이 숫자였던 구조 호환
      */

      if (
        typeof current ===
        "number"
      ) {

        data.exercises[
          exercise.id
        ] = {
          sets: current,
          weight: ""
        };

      }

      else if (
        !current
        ||
        typeof current !==
        "object"
      ) {

        data.exercises[
          exercise.id
        ] = {
          sets: 0,
          weight: ""
        };

      }

      else {

        if (
          current.sets ===
          undefined
        ) {

          current.sets =
            0;

        }


        if (
          current.weight ===
          undefined
        ) {

          current.weight =
            "";

        }

      }

    }
  );


  if (
    data.completed ===
    undefined
  ) {

    data.completed =
      false;

  }


  return data;

}


function getWorkoutData() {

  const weekKey =
    getCurrentWeekKey();


  const allData =
    getAllWorkoutData();


  if (
    !allData[weekKey]
  ) {

    allData[weekKey] =
      createDefaultWorkoutData();

  }


  allData[weekKey] =
    normalizeWorkoutData(
      allData[weekKey]
    );


  return allData[
    weekKey
  ];

}


function saveWorkoutData(
  workoutData
) {

  const weekKey =
    getCurrentWeekKey();


  const allData =
    getAllWorkoutData();


  allData[weekKey] =
    normalizeWorkoutData(
      workoutData
    );


  localStorage.setItem(
    "workoutCounter",
    JSON.stringify(
      allData
    )
  );

}


/* =========================================================
   PREVIOUS WORKOUT
========================================================= */

function getPreviousWorkoutWeight(
  exerciseId
) {

  const allData =
    getAllWorkoutData();


  const currentMonday =
    getMonday(
      new Date()
    );


  const keys =
    Object.keys(
      allData
    )
    .filter(
      key => {

        const date =
          dateFromWeekKey(
            key
          );

        return (
          date < currentMonday
        );

      }
    )
    .sort(
      (a, b) => {

        return (
          dateFromWeekKey(b)
          -
          dateFromWeekKey(a)
        );

      }
    );


  for (
    const key of keys
  ) {

    const workout =
      normalizeWorkoutData(
        allData[key]
      );


    const exercise =
      workout.exercises[
        exerciseId
      ];


    if (
      exercise
      &&
      exercise.weight !== ""
      &&
      exercise.weight !== null
      &&
      exercise.weight !== undefined
    ) {

      return exercise.weight;

    }

  }


  return "";

}


/* =========================================================
   WORKOUT SCREEN
========================================================= */

function openWorkout() {

  if (
    !isCurrentWeek()
  ) {

    alert(
      "운동 기록은 현재 주에서만 입력할 수 있어."
    );

    return;

  }


  document
    .getElementById(
      "mainScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "workoutScreen"
    )
    .classList.add(
      "open"
    );


  renderWorkout();


  window.scrollTo(
    0,
    0
  );

}


function closeWorkout() {

  document
    .getElementById(
      "workoutScreen"
    )
    .classList.remove(
      "open"
    );


  document
    .getElementById(
      "mainScreen"
    )
    .classList.remove(
      "hidden"
    );


  renderAll();


  window.scrollTo(
    0,
    0
  );

}


function renderWorkout() {

  const data =
    getWorkoutData();


  const exerciseList =
    document.getElementById(
      "exerciseList"
    );


  exerciseList.innerHTML =
    "";


  workoutExercises.forEach(
    exercise => {

      const exerciseData =
        data.exercises[
          exercise.id
        ];


      const completedSets =
        exerciseData.sets
        || 0;


      const previousWeight =
        getPreviousWorkoutWeight(
          exercise.id
        );


      const exerciseElement =
        document.createElement(
          "div"
        );


      exerciseElement.className =
        "exercise";


      const main =
        document.createElement(
          "div"
        );


      main.className =
        "exercise-main";


      /* LEFT */

      const info =
        document.createElement(
          "div"
        );


      info.className =
        "exercise-info";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "exercise-name";


      name.textContent =
        exercise.name;


      const reps =
        document.createElement(
          "div"
        );


      reps.className =
        "exercise-reps";


      reps.textContent =
        `${exercise.reps} REPS`;


      const last =
        document.createElement(
          "div"
        );


      last.className =
        "previous-weight";


      last.textContent =
        previousWeight !== ""
          ? `LAST ${previousWeight} kg`
          : "LAST —";


      info.appendChild(
        name
      );


      info.appendChild(
        reps
      );


      info.appendChild(
        last
      );


      /* RIGHT */

      const right =
        document.createElement(
          "div"
        );


      right.className =
        "exercise-right";


      const weightWrap =
        document.createElement(
          "div"
        );


      weightWrap.className =
        "weight-wrap";


      const weightInput =
        document.createElement(
          "input"
        );


      weightInput.type =
        "number";


      weightInput.inputMode =
        "decimal";


      weightInput.step =
        "0.5";


      weightInput.placeholder =
        "—";


      weightInput.className =
        "weight-input";


      weightInput.value =
        exerciseData.weight
        ?? "";


      weightInput.addEventListener(
        "change",
        () => {

          saveExerciseWeight(
            exercise.id,
            weightInput.value
          );

        }
      );


      const unit =
        document.createElement(
          "span"
        );


      unit.className =
        "weight-unit";


      unit.textContent =
        "kg";


      weightWrap.appendChild(
        weightInput
      );


      weightWrap.appendChild(
        unit
      );


      const dots =
        document.createElement(
          "div"
        );


      dots.className =
        "set-dots";


      for (
        let i = 0;
        i < exercise.sets;
        i++
      ) {

        const dot =
          document.createElement(
            "button"
          );


        dot.className =
          "set-dot";


        if (
          i < completedSets
        ) {

          dot.classList.add(
            "active"
          );

        }


        dot.addEventListener(
          "click",
          () => {

            updateWorkoutSet(
              exercise.id,
              i
            );

          }
        );


        dots.appendChild(
          dot
        );

      }


      right.appendChild(
        weightWrap
      );


      right.appendChild(
        dots
      );


      main.appendChild(
        info
      );


      main.appendChild(
        right
      );


      exerciseElement.appendChild(
        main
      );


      exerciseList.appendChild(
        exerciseElement
      );

    }
  );


  updateWorkoutProgress();

}


/* =========================================================
   WORKOUT WEIGHT
========================================================= */

function saveExerciseWeight(
  exerciseId,
  weight
) {

  const data =
    getWorkoutData();


  data.exercises[
    exerciseId
  ].weight =
    weight;


  saveWorkoutData(
    data
  );

}


/* =========================================================
   WORKOUT SETS
========================================================= */

function updateWorkoutSet(
  exerciseId,
  index
) {

  const data =
    getWorkoutData();


  const current =
    data.exercises[
      exerciseId
    ].sets
    || 0;


  const newValue =
    index < current
      ? index
      : index + 1;


  data.exercises[
    exerciseId
  ].sets =
    newValue;


  data.completed =
    false;


  saveWorkoutData(
    data
  );


  renderWorkout();

}


function getCompletedWorkoutSets() {

  const data =
    getWorkoutData();


  return workoutExercises.reduce(
    (sum, exercise) => {

      return (
        sum
        +
        (
          data.exercises[
            exercise.id
          ].sets
          || 0
        )
      );

    },
    0
  );

}


function updateWorkoutProgress() {

  const completed =
    getCompletedWorkoutSets();


  const percent =
    Math.round(
      (
        completed
        /
        totalWorkoutSets
      )
      * 100
    );


  document
    .getElementById(
      "workoutSetText"
    )
    .textContent =
    `${completed} / ${totalWorkoutSets} SETS`;


  document
    .getElementById(
      "workoutPercent"
    )
    .textContent =
    `${percent}%`;


  document
    .getElementById(
      "workoutProgressBar"
    )
    .style.width =
    `${percent}%`;


  const finishButton =
    document.getElementById(
      "finishWorkoutButton"
    );


  finishButton.disabled =
    completed
    !==
    totalWorkoutSets;


  const data =
    getWorkoutData();


  document
    .getElementById(
      "workoutFinished"
    )
    .classList.toggle(
      "show",
      data.completed
    );

}


/* =========================================================
   FINISH WORKOUT
========================================================= */

function finishWorkout() {

  const completed =
    getCompletedWorkoutSets();


  if (
    completed
    !==
    totalWorkoutSets
  ) {
    return;
  }


  const workoutData =
    getWorkoutData();


  workoutData.completed =
    true;


  saveWorkoutData(
    workoutData
  );


  const weekKey =
    getCurrentWeekKey();


  const weekData =
    getWeekData(
      weekKey
    );


  weekData.strength =
    1;


  saveWeekData(
    weekKey,
    weekData
  );


  renderWorkout();


  setTimeout(
    () => {

      closeWorkout();

    },
    500
  );

}


/* =========================================================
   RESET WORKOUT
========================================================= */

function resetWorkout() {

  if (
    !confirm(
      "이번 주 운동 세트 기록을 초기화할까?\n중량 입력도 초기화돼."
    )
  ) {
    return;
  }


  const weekKey =
    getCurrentWeekKey();


  const allWorkout =
    getAllWorkoutData();


  delete allWorkout[
    weekKey
  ];


  localStorage.setItem(
    "workoutCounter",
    JSON.stringify(
      allWorkout
    )
  );


  const weekData =
    getWeekData(
      weekKey
    );


  weekData.strength =
    0;


  saveWeekData(
    weekKey,
    weekData
  );


  renderWorkout();

}


/* =========================================================
   BACKUP
========================================================= */

function backupData() {

  const backup = {

    app:
      "weekly-counter",

    version:
      4,

    createdAt:
      new Date()
        .toISOString(),

    weekly:
      getAllData(),

    monthly:
      getAllMonthlyData(),

    workout:
      getAllWorkoutData()

  };


  const json =
    JSON.stringify(
      backup,
      null,
      2
    );


  const blob =
    new Blob(
      [json],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  const today =
    new Date()
      .toISOString()
      .slice(
        0,
        10
      );


  link.href =
    url;


  link.download =
    `weekly-counter-backup-${today}.json`;


  document.body.appendChild(
    link
  );


  link.click();


  document.body.removeChild(
    link
  );


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}


/* =========================================================
   RESTORE
========================================================= */

function openRestoreFile() {

  document
    .getElementById(
      "restoreFile"
    )
    .click();

}


function restoreData(event) {

  const file =
    event.target.files[0];


  if (
    !file
  ) {
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      try {

        const backup =
          JSON.parse(
            e.target.result
          );


        if (
          backup.app
          !==
          "weekly-counter"
        ) {

          alert(
            "Weekly Counter 백업 파일이 아니야."
          );


          event.target.value =
            "";


          return;

        }


        if (
          !confirm(
            "현재 기록을 백업 파일의 기록으로 교체할까?"
          )
        ) {

          event.target.value =
            "";

          return;

        }


        /*
          VERSION 1
        */

        if (
          backup.version === 1
          &&
          backup.data
        ) {

          localStorage.setItem(
            "weeklyCounter",
            JSON.stringify(
              backup.data
            )
          );

        }

        else {

          localStorage.setItem(
            "weeklyCounter",
            JSON.stringify(
              backup.weekly
              || {}
            )
          );


          localStorage.setItem(
            "monthlyCounter",
            JSON.stringify(
              backup.monthly
              || {}
            )
          );


          localStorage.setItem(
            "workoutCounter",
            JSON.stringify(
              backup.workout
              || {}
            )
          );

        }


        historyPage =
          0;


        displayedMonday =
          getMonday(
            new Date()
          );


        displayedMonth =
          new Date(
            new Date().getFullYear(),
            new Date().getMonth(),
            1
          );


        renderAll();


        alert(
          "RESTORE 완료."
        );

      }

      catch {

        alert(
          "백업 파일을 읽을 수 없어."
        );

      }


      event.target.value =
        "";

    };


  reader.readAsText(
    file
  );

}


/* =========================================================
   RENDER
========================================================= */

function renderAll() {

  updateWeekInfo();

  renderCounters();

  renderHistory();

  renderMonthly();

}


/* =========================================================
   START
========================================================= */

renderAll();

</script>
